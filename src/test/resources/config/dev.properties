# Dev environment. Same public demo APIs as the defaults, written out
# explicitly so a dev run never depends on remembering the fallback.
test.env=dev

api.baseUri=https://jsonplaceholder.typicode.com
httpbin.baseUri=https://httpbin.org

api.connectTimeoutMs=5000
api.readTimeoutMs=10000
api.requestTimeoutMs=10000

auth.basic.username=user
auth.basic.password=passwd
auth.bearer.token=sometoken123
