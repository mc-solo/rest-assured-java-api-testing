# Default configuration for the test suite.
# Committed on purpose: every value here targets the public demo APIs only.
# Override order (highest first): env var > -D system property > .env file
# > config/{env}.properties > this file > hard-coded fallback in TestConfig.
# See docs/SETUP.md and ARCHITECTURE.md.

# Active environment: dev or prod. Selects config/{env}.properties.
test.env=dev

# Base URIs. The only URLs in this repo; both are public demo APIs.
api.baseUri=https://jsonplaceholder.typicode.com
httpbin.baseUri=https://httpbin.org

# Timeouts in milliseconds.
api.connectTimeoutMs=5000
api.readTimeoutMs=10000
api.requestTimeoutMs=10000

# Dummy demo credentials for httpbin's public /basic-auth endpoint.
# Not real accounts. Override with AUTH_BASIC_USERNAME / AUTH_BASIC_PASSWORD.
auth.basic.username=user
auth.basic.password=passwd

# Dummy token echoed back by httpbin's public /bearer endpoint. Not a real token.
auth.bearer.token=sometoken123
