# Prod environment. There is no real production API for this suite:
# the tests only ever target the public demo APIs (JSONPlaceholder and
# httpbin), so prod points at the same endpoints as dev. If a real API is
# ever added, point api.baseUri / httpbin.baseUri at it here and keep the
# dummy credentials out of this file; use env vars instead.
test.env=prod

api.baseUri=https://jsonplaceholder.typicode.com
httpbin.baseUri=https://httpbin.org

api.connectTimeoutMs=5000
api.readTimeoutMs=10000
api.requestTimeoutMs=10000

auth.basic.username=user
auth.basic.password=passwd
auth.bearer.token=sometoken123
